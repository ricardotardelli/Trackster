<app-dialogshell
  title="Payload Preview"
  [showFooter]="false"
  (closeClicked)="closeDialog()">

  <div class="payload-pre-wrapper">
    <button
      type="button"
      class="copy-button"
      (click)="copyPayload()"
      matTooltip="Copy payload"
      aria-label="Copy payload" 
      title="Copy payload">
      <mat-icon>content_copy</mat-icon>
    </button>

    <div class="payload-scroll-area">
      <pre>{{ payloadText || 'No payload to show' }}</pre>
    </div>
  </div>
</app-dialogshell>
