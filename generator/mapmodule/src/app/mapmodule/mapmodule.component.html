<div class="route-picker-container">
  <div class="controls-block">
    <div class="toolbar">
      <div class="field-group search-group">
        <label for="locationSearch">Location</label>

        <div class="search-row">
          <input
            id="locationSearch"
            name="locationSearch"
            type="text"
            [(ngModel)]="locationSearch"
            [placeholder]="getLocationPlaceholder()"
            (keyup.enter)="searchSelectedAddress()"
            (blur)="searchSelectedAddress()"
          />

          <button
            type="button"
            class="primary"
            (click)="searchSelectedAddress()"
            [disabled]="pointSelectionMode === 'waypoints'">
            Search
          </button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button
        type="button"
        (click)="setSelectionMode('start')"
        [class.active]="pointSelectionMode === 'start'">
        Start Point
      </button>

      <button
        type="button"
        (click)="setSelectionMode('waypoints')"
        [class.active]="pointSelectionMode === 'waypoints'">
        Waypoints
      </button>

      <button
        type="button"
        (click)="setSelectionMode('destination')"
        [class.active]="pointSelectionMode === 'destination'">
        Destination
      </button>

      <button type="button" (click)="swapPoints()" class="primary">
        Swap
      </button>

      <button type="button" (click)="clearAll()" class="primary">
        Clear
      </button>
    </div>
  </div>

  <div
    class="map"
    leaflet
    [leafletOptions]="options"
    [leafletLayers]="layers"
    (leafletMapReady)="onMapReady($event)"
    (leafletClick)="onMapClick($event)">
  </div>

  <div class="coordinates-panel" style="display:none;">
    <div class="coord-block">
      <h3>Start</h3>
      <pre>{{ startPoint | json }}</pre>
    </div>

    <div class="coord-block">
      <h3>Waypoints</h3>
      <pre>{{ waypoints | json }}</pre>
    </div>

    <div class="coord-block">
      <h3>Destination</h3>
      <pre>{{ destinationPoint | json }}</pre>
    </div>
  </div>

  <div class="output-panel">
    <h3>Output JSON</h3>
    <pre>{{ getOutput() }}</pre>
  </div>
</div>
