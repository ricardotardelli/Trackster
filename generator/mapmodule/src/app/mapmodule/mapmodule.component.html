<div class="route-picker-container">
  <div class="toolbar">
    <div class="field-group">
      <label for="startFrom">Start from</label>
      <input
        id="startFrom"
        name="startFrom"
        type="text"
        [(ngModel)]="startFrom"
        placeholder="Select or type start point name"
        (input)="testEvent('start input')"
        (change)="testEvent('start change')"
        (keyup.enter)="searchAddress(startFrom, 'start')"
        (blur)="searchAddress(startFrom, 'start')"
      />

      <button type="button" (click)="searchAddress(startFrom, 'start')">
        Search Start
      </button>
    </div>

    <div class="field-group">
      <label for="destination">Destination</label>
      <input
        id="destination"
        type="text"
        [(ngModel)]="destination"
        placeholder="Select or type destination name"
        (keydown.enter)="searchAddress(destination, 'destination')"
        (blur)="searchAddress(destination, 'destination')"
      />
    </div>
  </div>

  <div class="actions">
    <div class="actions">
      <button
        type="button"
        (click)="setSelectionMode('start')"
        [class.active]="pointSelectionMode === 'start'">
        Select Start on Map
      </button>

      <button
        type="button"
        (click)="setSelectionMode('waypoints')"
        [class.active]="pointSelectionMode === 'waypoints'">
        Define Waypoints
      </button>

      <button
        type="button"
        (click)="setSelectionMode('destination')"
        [class.active]="pointSelectionMode === 'destination'">
        Select Destination on Map
      </button>

</div>

    <button type="button" (click)="swapPoints()" class="primary">
      Swap
    </button>

    <button type="button" (click)="clearAll()" class="primary">
      Clear
    </button>
  </div>

  <div class="selection-mode">
    Current selection mode: <strong>{{ pointSelectionMode }}</strong>
  </div>

  <div
    class="map"
    leaflet
    [leafletOptions]="options"
    [leafletLayers]="layers"
    (leafletMapReady)="onMapReady($event)"
    (leafletClick)="onMapClick($event)">
  </div>

  <div class="coordinates-panel">
    <div class="coord-block">
      <h3>Start</h3>
      <pre>{{ startPoint | json }}</pre>
    </div>

    <div class="coord-block">
      <h3>Waypoints</h3>
      <pre>{{ waypoints | json }}</pre>
    </div>

    <div class="coord-block">
      <h3>Destination</h3>
      <pre>{{ destinationPoint | json }}</pre>
    </div>
  </div>

  <div class="output-panel">
    <h3>Output JSON</h3>
    <pre>{{ getOutput() }}</pre>
  </div>
</div>
