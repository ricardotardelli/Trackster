<app-dialogshell
  [title]="data.title"
  [subtitle]="data.subtitle"
  [showFooter]="true"
  contentClass="dialog-shell__body--no-scroll"
  (closeClicked)="cancel()">
  <div class="dbc-editor-layout">
    <div class="dbc-editor-toolbar">
      <div class="dbc-toolbar">
        <div class="dbc-toolbar-left">
          <button class="dbc-tool-btn" (click)="runDiagnostics()">
            <mat-icon>check_circle</mat-icon>
            <span>Diagnostic</span>
          </button>

          <button class="dbc-tool-btn" (click)="undo()">
            <mat-icon>undo</mat-icon>
            <span>Undo</span>
          </button>

          <button class="dbc-tool-btn" (click)="redo()">
            <mat-icon>redo</mat-icon>
            <span>Redo</span>
          </button>

          <button class="dbc-tool-btn" (click)="find()">
            <mat-icon>search</mat-icon>
            <span>Find</span>
          </button>

          <button class="dbc-tool-btn" (click)="toggleFind(true)">
            <mat-icon>find_replace</mat-icon>
            <span>Replace</span>
          </button>

          <button
            class="dbc-tool-btn"
            (mousedown)="$event.preventDefault()"
            (click)="goToLine()">
            <mat-icon>format_list_numbered</mat-icon>
            <span>Line</span>
          </button>

          <button
            class="dbc-tool-btn"
            [class.is-active]="editorOptions.wordWrap === 'on'"
            (click)="toggleWrap()">
            <mat-icon>wrap_text</mat-icon>
            <span>Wrap</span>
          </button>

          <button class="dbc-tool-btn" (click)="revert()">
            <mat-icon>restart_alt</mat-icon>
            <span>Revert</span>
          </button>
        </div>

        <div class="dbc-toolbar-right">
          <div class="dbc-diagnostics-wrapper">
            <button
              class="dbc-diagnostics-badge"
              [ngClass]="{
                'dbc-diagnostics-badge--not-verified': diagnosticsState === 'not-verified',
                'dbc-diagnostics-badge--ok': diagnosticsState === 'ok',
                'dbc-diagnostics-badge--error': diagnosticsState === 'error',
                'dbc-diagnostics-badge--clickable': diagnosticsState === 'error'
              }"
              (click)="toggleIssuesDropdown()">
              {{ diagnosticsLabel }}
              <span *ngIf="diagnosticsState === 'error'" class="dbc-badge-arrow">▾</span>
            </button>

            <div *ngIf="issuesDropdownVisible" class="dbc-issues-dropdown">
              <div
                *ngFor="let error of diagnosticsReport?.errors; let i = index"
                class="dbc-issue-item"
                (click)="goToIssue(error)">
                Line {{ error.line }} — {{ error.message }}
              </div>
            </div>
          </div>

          <span class="dbc-diagnostics-time">
            Last run: {{ lastDiagnosticsLabel }}
          </span>
        </div>
      </div>
    </div>

    <div class="dbc-editor-surface">
      <app-dbcfind
        *ngIf="findVisible"
        [editor]="editor"
        [replaceVisible]="replaceVisible"
        [initialQuery]="initialFindQuery"
        (closed)="closeFind()">
      </app-dbcfind>

      <ngx-monaco-editor
        [(ngModel)]="dbcText"
        [options]="editorOptions"
        [editorStyle]="{ width: '100%', height: '100%' }"
        (editorInitialized)="onEditorInit($event)">
      </ngx-monaco-editor>
    </div>
  </div>

  <div dialog-actions>
    <button
      type="button"
      class="trackster-button trackster-button--secondary"
      (click)="cancel()">
      Cancel
    </button>

    <button
      type="button"
      class="trackster-button trackster-button--primary"
      (click)="save()">
      Save
    </button>
  </div>

  <ng-template #confirmSaveDialog>
    <app-dialogshell
      title="Confirm save"
      subtitle="This file has changes"
      [showFooter]="true"
      (closeClicked)="confirmDialogRef?.close(false)">

      <div style="padding: 6px 2px 2px; color: #334155; font-size: 14px;">
        Do you want to save the changes before closing the editor?
      </div>

      <div dialog-actions>
        <button
          type="button"
          class="trackster-button trackster-button--secondary"
          (click)="confirmDialogRef?.close(false)">
          Cancel
        </button>

        <button
          type="button"
          class="trackster-button trackster-button--primary"
          (click)="confirmDialogRef?.close(true)">
          Save
        </button>
      </div>
    </app-dialogshell>
  </ng-template>
</app-dialogshell>
