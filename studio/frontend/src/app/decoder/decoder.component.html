<div class="workspace-view">
  <div class="module-stage-shell">
    <div class="workspace-grid">

      <aside class="workspace-sidebar status-panel">
        <h2>CAN Files Explorer</h2>

        <div class="tree-shell">
          <div class="tree-loading" *ngIf="isLoadingBinCatalog"> Loading BIN catalog...</div>
          <mat-tree
            [dataSource]="s3TreeDataSource"
            [treeControl]="s3TreeControl"
            class="trackster-tree">

            <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
              <div class="tree-node tree-node-folder">
                <button
                  type="button"
                  class="tree-toggle"
                  matTreeNodeToggle>
                  <mat-icon>
                    {{ s3TreeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                  </mat-icon>
                </button>

                <button
                  type="button"
                  class="tree-label"
                  (click)="selectS3Node(node)">
                  <mat-icon class="tree-icon">
                    {{ s3TreeControl.isExpanded(node) ? 'folder_open' : 'folder' }}
                  </mat-icon>

                  <span class="tree-text">
                    {{ node.name }}
                  </span>
                </button>
              </div>

              <div
                class="tree-children"
                [class.tree-children-hidden]="!s3TreeControl.isExpanded(node)">
                <ng-container matTreeNodeOutlet></ng-container>
              </div>
            </mat-nested-tree-node>

            <mat-tree-node *matTreeNodeDef="let node">
              <div class="tree-node tree-node-file">
                <span class="tree-indent"></span>

                <button
                  type="button"
                  class="tree-label"
                  [class.tree-label-selected]="selectedS3Node === node"
                  [class.tree-label-bin]="node.name.endsWith('.bin')"
                  [class.tree-label-json]="node.name.endsWith('.json')"
                  (click)="selectS3Node(node)">
                  <mat-icon class="tree-icon">
                    {{ node.name.endsWith('.json') ? 'data_object' : 'description' }}
                  </mat-icon>

                  <span class="tree-text">
                    {{ node.name }}
                  </span>
                </button>
              </div>
            </mat-tree-node>

          </mat-tree>
        </div>
      </aside>

      <section class="workspace-body">
        <div class="workspace-body-header">
          <h2>Decoder Workspace</h2>
          <p>
            Inspect generated files, decode CAN payloads, replay sessions,
            and prepare export workflows.
          </p>
        </div>

        <div class="workspace-body-content">
          <div class="module-card-grid">

            <section class="module-card placeholder-card">
              <div class="card-header-row">
                <h3>Explorer</h3>
              </div>

              <div class="placeholder-body">
                <p>
                  S3 treeview placeholder.
                </p>
              </div>
            </section>

            <section class="module-card placeholder-card">
              <div class="card-header-row">
                <h3>Decoder / Replay</h3>
              </div>

              <div class="placeholder-body">
                <p>
                  Decoder workspace placeholder.
                </p>
              </div>
            </section>

          </div>
        </div>
      </section>

    </div>
  </div>
</div>
