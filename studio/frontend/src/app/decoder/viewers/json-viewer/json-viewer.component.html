<div class="json-viewer-layout">

  <div class="json-viewer-main">

    <div class="json-viewer-panel">

      <div class="json-viewer-header">

        <div class="json-viewer-title">

          <h4>
            Decoded Frames JSON
          </h4>

          <span>
            Read-only Monaco JSON viewer
          </span>

        </div>

        <div class="json-viewer-actions">

          <div class="json-find-box">

            <input
              type="text"
              class="json-search-input"
              placeholder="Find"
              [(ngModel)]="jsonSearchText"
              (input)="applyEditorSearch(true)"
              (keydown.enter)="searchNextOccurrence()"
              (keydown.shift.enter)="searchPreviousOccurrence()">

            <span class="json-search-count">
              {{ searchMatchLabel }}
            </span>

            <button
              type="button"
              class="json-search-button"
              title="Previous match"
              [disabled]="searchMatchCount === 0"
              (click)="searchPreviousOccurrence()">

              ‹

            </button>

            <button
              type="button"
              class="json-search-button"
              title="Next match"
              [disabled]="searchMatchCount === 0"
              (click)="searchNextOccurrence()">

              ›

            </button>

            <button
              type="button"
              class="json-search-button json-search-button-close"
              title="Clear search"
              [disabled]="!jsonSearchText"
              (click)="clearEditorSearch()">

              ×

            </button>

          </div>

          <button
            type="button"
            class="json-action-button"
            [class.json-action-button-active]="jsonViewMode === 'pretty'"
            (click)="setJsonViewMode('pretty')">

            Pretty

          </button>

          <button
            type="button"
            class="json-action-button"
            [class.json-action-button-active]="jsonViewMode === 'raw'"
            (click)="setJsonViewMode('raw')">

            Raw

          </button>

          <button
            type="button"
            class="json-action-button json-action-button-primary"
            (click)="copyFullJsonToClipboard()">

            Copy JSON

          </button>

        </div>

      </div>

      <div
        class="json-loading"
        *ngIf="isLoadingJson">

        Decoding BIN file as JSON...

      </div>

      <div
        class="json-error"
        *ngIf="
          !isLoadingJson &&
          jsonErrorMessage
        ">

        {{ jsonErrorMessage }}

      </div>

      <div
        class="json-empty-state"
        *ngIf="
          !isLoadingJson &&
          !jsonErrorMessage &&
          !displayJsonText
        ">

        No JSON content available.

      </div>

      <div class="json-monaco-container-shell">

        <ngx-monaco-editor
          *ngIf="
            !isLoadingJson &&
            !jsonErrorMessage &&
            displayJsonText
          "
          class="json-monaco-editor"
          [options]="editorOptions"
          [ngModel]="displayJsonText"
          (editorInitialized)="onEditorInitialized($event)">
        </ngx-monaco-editor>

      </div>

    </div>

  </div>

  <aside class="json-summary-sidebar">

    <div
      class="json-summary-box"
      *ngFor="let item of jsonViewer.summary">

      <span>
        {{ item.label }}
      </span>

      <strong>
        {{ item.value }}
      </strong>

    </div>

  </aside>

</div>
