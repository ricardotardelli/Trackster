<app-dialogshell title="Payload Preview" [showFooter]="false" >
  <div class="payload-frame">
    <button type="button" class="copy-button" (click)="copyPayload()" matTooltip="Copy payload" aria-label="Copy payload">
      <mat-icon>content_copy</mat-icon>
    </button>

    <pre class="payload-text">{{ payloadText || 'No payload to show' }}</pre>
  </div>
</app-dialogshell>
