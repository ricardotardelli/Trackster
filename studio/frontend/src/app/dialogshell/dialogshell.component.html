<div class="dialog-shell">
  <div class="dialog-shell__header">
    <div class="dialog-shell__titles">
      <h2 class="dialog-shell__title">{{ title }}</h2>
      <p *ngIf="subtitle" class="dialog-shell__subtitle">{{ subtitle }}</p>
    </div>
    <button type="button" class="dialog-shell__close" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-shell__body">
    <div class="dialog-shell__content-frame" [ngClass]="contentClass">
      <div class="dialog-shell__scroll-boundary">
        <div class="dialog-shell__scroll-region">
          <ng-content></ng-content>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="showFooter" class="dialog-shell__footer">
    <ng-content select="[dialog-actions]"></ng-content>
  </div>
</div>
