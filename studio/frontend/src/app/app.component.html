<div *ngIf="authReady && isAuthenticated">
  <main class="page">
    <section class="panel">
      <div class="panel-brand">
        <img src="../assets/img/TracksterLogo.svg" alt="Trackster" class="panel-brand-logo" />
        <span class="brand-name">Trackster</span>
      </div>

      <div class="panel-header">
        <div class="panel-header-main">
          <div class="brand-row">
            <div class="brand-copy">
              <h1>{{ activeWorkspaceTitle }}</h1>
              <p class="subtitle">{{ activeWorkspaceDescription }}</p>
            </div>
          </div>
        </div>

        <div class="user-menu" #userMenuContainer>
          <button
            type="button"
            class="user-menu-trigger"
            (click)="toggleUserMenu($event)"
            [attr.aria-expanded]="userMenuOpen"
            aria-haspopup="menu"
          >
            <span class="user-avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="user-avatar-icon">
                <path
                  d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5Z"
                  fill="currentColor"
                />
              </svg>
            </span>

            <span class="user-menu-name">{{ username }}</span>

            <span class="user-menu-caret" aria-hidden="true">
              <svg viewBox="0 0 20 20" class="user-caret-icon">
                <path
                  d="M5.25 7.5 10 12.25 14.75 7.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </button>

          <div class="user-menu-dropdown" *ngIf="userMenuOpen" role="menu">
            <a
              class="user-menu-item"
              href=""
              role="menuitem"
              (click)="$event.preventDefault(); closeUserMenu()"
            >
              About
            </a>

            <div class="user-menu-divider"></div>

            <button
              type="button"
              class="user-menu-item logout-item"
              role="menuitem"
              (click)="onLogout()"
              [disabled]="isLoggingOut"
            >
              {{ isLoggingOut ? 'Logging out...' : 'Logout' }}
            </button>
          </div>
        </div>
      </div>

      <div class="workspace-shell">
        <mat-tab-group
          class="trackster-tabs"
          [selectedIndex]="selectedTabIndex"
          (selectedIndexChange)="onTabChange($event)"
          animationDuration="0ms"
          mat-stretch-tabs="false"
          mat-align-tabs="start"
        >
          <mat-tab label="Simulation Generator">
            <app-simulator></app-simulator>
          </mat-tab>

          <mat-tab label="DBC Workspace">
            <app-dbcworkspace></app-dbcworkspace>
          </mat-tab>

          <mat-tab label="Decoder / Exporter">
            <app-decoder></app-decoder>
          </mat-tab>

          <mat-tab label="Signal Plotter">
            <app-signal-plotter></app-signal-plotter>
          </mat-tab>

          <mat-tab *ngIf="canSeeAdministrationTab" [label]="administrationTabLabel">
            <app-master-admin *ngIf="isTracksterAdmin"></app-master-admin>
            <app-client-admin *ngIf="!isTracksterAdmin && isClientAdmin"></app-client-admin>
          </mat-tab>
        </mat-tab-group>
      </div>
    </section>
  </main>
</div>
